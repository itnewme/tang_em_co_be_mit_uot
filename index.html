<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Của Ngọc Mai 🌸</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="welcome-screen" class="active">
        <div class="murakami-cover">
            <div class="murakami-flower">🌸</div>
            <h1 class="pop-title">Một thế giới siêu rực rỡ <br>đang chờ em...</h1>
            <p class="pop-subtitle">Chạm vào bông hoa để mở ra thế giới của Mai</p>
            <button id="start-btn">Khám phá ngay 🌈</button>
        </div>
    </div>

    <div id="main-screen">
        <div class="pop-card">
            <h1 class="love-title-pop">Chào mừng <span id="crush-name">Nguyễn Ngọc Mai</span> <br>đến với vũ trụ tình yêu! 💖</h1>
            <p class="love-subtitle-pop">Nơi chứa 1 vạn quả cà chua và máy xúc siêu to đùng!</p>
        </div>
        <div id="animation-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
