<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi người anh thuong...</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="welcome-screen" class="active">
        <div class="art-cover">
            <div class="flower-icon">✿</div>
            <h1 class="aesthetic-title">Có một thế giới nhỏ <br>muốn gửi tặng em...</h1>
            <p class="aesthetic-subtitle">Chạm nhẹ vào đây để mở ra nhé</p>
            <button id="start-btn">Mở ra ✨</button>
        </div>
    </div>

    <div id="main-screen">
        <div class="glass-card">
            <h1 class="main-love-title">Nơi chứa những điều ngọt ngào của <span id="crush-name">[Nguyễn Ngọc Mai]</span></h1>
            <p class="love-quote">"Giữa thế giới bận rộn, cảm ơn  vì đã xuất hiện..."</p>
        </div>
        <div id="animation-container"></div>
    </div> <script src="script.js"></script>
</body>
</html>
